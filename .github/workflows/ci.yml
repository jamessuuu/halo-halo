name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # BATCH-2-STANDARDS.md's verification bar, in order: typecheck ->
      # lint -> unit -> build -> e2e:smoke (against the REAL static export,
      # never a dev server) -> the build-artifact/drift gates that only
      # make sense once that build exists.
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit
        run: pnpm test
      - name: build
        run: pnpm build
      - name: install playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e:smoke (playwright against the real static export)
        run: pnpm e2e:smoke
      - name: zero-functions gate
        run: pnpm ci:zero-functions
      - name: brand drift
        run: pnpm ci:brand-check
      - name: eval report drift (docs/batch2-linguistic-spec.md's committed-fixture pattern)
        run: pnpm ci:eval-check
